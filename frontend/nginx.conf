server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Vite content-hashes every file in /assets - safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API calls to the backend. The upstream address is
    # templated so the same image works for Docker Compose (API_UPSTREAM=backend:8000)
    # and K8s (API_UPSTREAM=api:8000). nginx:alpine substitutes ${VAR} at
    # container start when the file is placed under /etc/nginx/templates/.
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React Router client-side routes (e.g. /rankings) must fall back to
    # index.html - there's no server-side route for them. index.html itself
    # must never be cached, or clients keep loading stale asset hashes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
