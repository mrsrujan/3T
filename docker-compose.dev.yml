# Legacy hot-reload dev stack: SQLite + uvicorn --reload + Vite dev server.
# For the production-like Postgres topology, use docker-compose.yml.
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  backend:
    build: ./backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8010:8000"
    volumes:
      - stocks_data:/data
      - ./backend/app:/app/app
    environment:
      - STOCKS_DATABASE_URL=sqlite:////data/stocks.db
      - STOCKS_KIMCHI_API_KEY=${STOCKS_KIMCHI_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8010
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  stocks_data:
