apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Alembic runs once before the API process starts. Idempotent, so safe
      # even if multiple replicas race (second one is a no-op). Alternative
      # would be a one-shot Job, but initContainer keeps the deployment
      # self-contained.
      initContainers:
        - name: migrate
          image: stockmantra-backend:phase2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: stockmantra-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stockmantra-secrets
                  key: POSTGRES_PASSWORD
            - name: STOCKS_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
      containers:
        - name: api
          image: stockmantra-backend:phase2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: stockmantra-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stockmantra-secrets
                  key: POSTGRES_PASSWORD
            - name: STOCKS_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: STOCKS_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stockmantra-secrets
                  key: STOCKS_ANTHROPIC_API_KEY
            - name: STOCKS_GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stockmantra-secrets
                  key: STOCKS_GROQ_API_KEY
            - name: STOCKS_KIMCHI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stockmantra-secrets
                  key: STOCKS_KIMCHI_API_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
