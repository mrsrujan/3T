# Rename this to secret.yaml and fill in real values. secret.yaml is
# .gitignored so the real secret never gets committed.
#
# `stringData` lets you paste plaintext (K8s base64-encodes at apply time).
#
# Minimal setup only requires POSTGRES_PASSWORD. AI keys are optional - the
# forecast + news-sentiment features degrade gracefully when they're empty.
apiVersion: v1
kind: Secret
metadata:
  name: stockmantra-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: changeme
  STOCKS_ANTHROPIC_API_KEY: ""
  STOCKS_GROQ_API_KEY: ""
  STOCKS_KIMCHI_API_KEY: ""
