# One-off bootstrap: populate an empty DB with ~400 days of NSE history.
# NOT part of the default kustomization (don't want this firing on every
# `kubectl apply`). Apply explicitly on first install:
#
#   kubectl apply -f k8s/base/job-backfill.yaml
#   kubectl -n stockmantra logs job/stockmantra-backfill -f
#
# Idempotent: if trading_calendar already has rows, backfill_market is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: stockmantra-backfill
  namespace: stockmantra
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cli
          image: stockmantra-backend:phase2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.cli", "backfill"]
          envFrom:
            - configMapRef:
                name: stockmantra-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: stockmantra-secrets, key: POSTGRES_PASSWORD } }
            - name: STOCKS_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 2Gi }
