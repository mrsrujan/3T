# NodePort so you can hit Jenkins at http://localhost:30808 from the host
# without a port-forward tab open. Change to ClusterIP + kubectl port-forward
# if you prefer not to expose a NodePort.
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  type: NodePort
  selector:
    app: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808
    - name: agent
      port: 50000
      targetPort: 50000
